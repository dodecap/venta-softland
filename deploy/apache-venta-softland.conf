# Venta Softland — servir Laravel desde public/ bajo /venta-softland
# (XAMPP en srv, mismo vhost del puerto 8086 que usa rinde-caja).
Alias /venta-softland "C:/xampp/htdocs/venta-softland/public"
<Directory "C:/xampp/htdocs/venta-softland/public">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
